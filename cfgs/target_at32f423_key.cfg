# 钥匙板(AT32F423TCU7)专用 target cfg。
# 固件在 VBUS 掉电+空闲时进 deepsleep(EXTRA_LOW_POWER 档,深睡下禁止调试,
# AHB-AP 全堵),探针后插上时正常 attach 必然 stalled AP。
# connect_assert_srst:连接瞬间先拉住复位再 examine,趁复位态完成附加并置位
# DHCSR.C_DEBUGEN——固件侧 keycode_deepsleep_enter 检测到调试器即不再休眠,
# 之后烧录/调试都不会再遇到睡死。
#
# 实测(2026-10-06 ocdup bring-up,本 cfg 即 bring-up 的答案):
#   * 之前的 can't assert SRST / Error connecting DP 不再复现,attach 一次成功;
#   * CPUID = Cortex-M4 r0p1;DEV_ID = 0x250(0xE0042000 读回 0x700a3250,rev 0x700a)
#     —— 已填进 ocd.json 的 chip_id_map;
#   * flash 单 bank @0x08000000,256KB;halt / 读向量表 / resume 全链路通过。
# 实测(2026-10-07 新自建二进制 atopenocd-py32 回归):
#   * 只写 connect_assert_srst 不够 —— "BUG: can't assert SRST" 复现,芯片 deepsleep
#     解不掉、examine 失败;补 srst_only srst_nogate 后 reset halt 一次救活。
source [find target/at32f423xx.cfg]
# srst_only srst_nogate 必须显式写:connect_assert_srst 只设「连接时拉复位」行为位,
# 不设 RESET_HAS_SRST;缺了它拉复位时 openocd 报 "BUG: can't assert SRST",
# 芯片睡死无法解(2026-10-07 新二进制实测)。reset_config 是合并语义,可一次写全。
reset_config srst_only srst_nogate connect_assert_srst
