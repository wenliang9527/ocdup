# 锁芯板(PY32F002A,Cortex-M0+,20KB flash @0x08000000)烧录 target cfg。
# 与 target_py32f002a_lock.cfg(纯调试,不挂 flash 驱动)的唯一区别:
# 多一行 flash bank 声明,挂 **puyaf0x** 驱动——该驱动是给 ArteryTek/openocd
# (atopenocd 基座)移植的 PY32F0 flash 驱动,参考 l0ud/openocd-puya,
# 自编译的二进制(atopenocd-py32)完整构建记录见 docs/openocd-puya-build.md。
# 烧录纪律:flash_write 前先 dump 一份现有固件(锁芯板出厂固件不可再得);
# 量产产线仍走 J-Link + prod_burn.py,本 cfg 只服务开发/复盘场景。
#
# 实测(2026-10-06):
#   * attach/CPUID = Cortex-M0+ r0p1;flash 单 bank @0x08000000,128B/页;
#   * PY32F002A 的 flash 寄存器与 STM32F0 同源但偏移 +4(KEYR@0x40022008,
#     RM V1.4 §4.2.3 与 Puya SVD 双重印证);编程模型 = 31 字 → PGSTRT → 第 32 字;
#   * **2026-10-07 烧录闭环实测通过**:整片 20KB 擦+写 2.3s,openocd verify OK,
#     独立回读 sha256 与备份逐字节一致;
#   * ⚠️ 已知怪癖:擦/写期间 openocd 会打 "Failed to write memory at 0x..." ——
#     Puya 总线对 flash 写返回虚假错误(操作实际已锁存生效),**以 verify_image /
#     回读 sha 为准**;因此 ocdup flash_write 会报"失败",须单独 verify_image 确认;
#   * PY32 无 DBGMCU_IDCODE 惯例(0x40015800 读回 0x60001000,低 12 位非 DEV_ID),
#     驱动 probe 即以 rev_id==0x6000 识别 Puya 家族。

transport select swd
adapter speed 1000

set _CHIPNAME py32f002a
swd newdap $_CHIPNAME cpu -irlen 0 -ircapture 0x1 -irmask 0x0
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap

# 20KB = 0x5000,页大小 128B;显式给尺寸,不依赖片内 flash size 寄存器
flash bank $_CHIPNAME.flash puyaf0x 0x08000000 0x5000 0 0 $_CHIPNAME.cpu
