# 锁芯板(PY32F002A, Cortex-M0+, 20KB flash @0x08000000)专用 target cfg。
# 仅用于 SWD 调试读存储(出厂页/KLOCK 页)/烧录仍走 Keil+DAPLink 或 J-Link。
# 最小通用 cortex_m 目标,不挂 flash 驱动(dump_memory 走 AHB-AP 直读)。
# PY32F002A 无 deepsleep 禁调试问题(总线由钥匙 3.3V 供电,USB 插着即常供电),
# 不用 connect_assert_srst。探针纪律同钥匙:connect 后立刻读,不留空闲。
#
# 实测(2026-10-06 ocdup 调试链路验证):
#   * attach 一次成功,CPUID = Cortex-M0+ r0p1(ARMv6-M);
#   * DEV_ID 无惯例可依赖:0xE0042000 读回 0(无 STM32/AT32 DBGMCU 惯例),
#     0x40015800 读回 0x60001000(低 12 位无 DEV_ID 编码)——Puya 识别靠
#     CPUID + target_cfg 语境,chip_id_map 对它不适用;
#   * halt / dump_memory(0x08000000 起向量表完好:SP=0x20000650、复位向量
#     0x080000d5)/ 读 RAM / resume 全链路通过;flash_info 如期无 bank
#     (本 cfg 不挂驱动,烧录仍走 Keil)。

transport select swd
adapter speed 1000

set _CHIPNAME py32f002a
swd newdap $_CHIPNAME cpu -irlen 0 -ircapture 0x1 -irmask 0x0
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap
