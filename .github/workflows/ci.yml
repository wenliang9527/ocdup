name: ci

on:
  push:
    branches: ['**']
  pull_request:

# v0.4.38 (audit D8-1b): a PR branch pushes AND raises a PR - without this group every
# push runs the full two-job suite twice side by side. Superseded runs on the same ref cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # v0.4.38 (audit D8-1a): restore was re-downloading the package set every run
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (Debug, feeds the e2e fake-backend path)
        run: dotnet build Ocdup.sln --nologo

      - name: Unit tests
        run: dotnet test Ocdup.sln --no-build --nologo -v q

      - name: End-to-end (fake TCL-RPC backend + real MCP stdio session)
        run: python tools/e2e_fake_backend.py

      - name: Tool description byte budget (regression guard, v0.4.33)
        run: python tools/measure_tools.py --budget 25500

  panel-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Panel behavior tests (zero-dependency, self-configured env)
        working-directory: tools/dsh-ocdup-panel
        run: |
          node test.js core
          node test.js window
          node test.js api
          node test.js client
